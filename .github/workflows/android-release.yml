name: Android Signed Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; fi
          [[ "$TAG" =~ ^v[0-9]+\.0\.[0-9]+$ ]] || { echo "Invalid tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.rel.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: npm ci
      - run: npm run verify:version
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
      - run: npm run typecheck
      - run: npm run sync:android
      - name: Check release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "Missing required secret: $name"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/farm-calculator-release.jks"
      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/farm-calculator-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          gradle bundleRelease
      - name: Verify signatures and prepare files
        id: files
        shell: bash
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          mkdir -p "${RUNNER_TEMP}/release-output"
          apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk "${RUNNER_TEMP}/release-output/FarmCalculator-${TAG}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "${RUNNER_TEMP}/release-output/FarmCalculator-${TAG}.aab"
          echo "dir=${RUNNER_TEMP}/release-output" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FarmCalculator-${{ steps.rel.outputs.tag }}
          path: ${{ steps.files.outputs.dir }}/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.files.outputs.dir }}/*
